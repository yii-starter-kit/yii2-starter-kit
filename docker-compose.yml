services:
  frontend:
    build: frontend
    volumes:
      # Mount source-code for development
      - ./:/app
      - ./docker/php/php-app.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro

  backend:
    build: backend
    volumes:
      # Mount source-code for development
      - ./:/app
      - ./docker/php/php-app.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro

  console:
    build: console
    volumes:
      # Re-use local composer cache via host-volume
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      # Mount source-code for development
      - ./:/app
      - ./docker/php/php-app.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    working_dir: /app

  storage:
    build: storage
    volumes:
      # Mount source-code for development
      - ./:/app
      - ./docker/php/php-app.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro

  api:
    build: api
    volumes:
      # Mount source-code for development
      - ./:/app
      - ./docker/php/php-app.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro

  nginx:
    image: nginx:stable-alpine
    ports:
      - 80:80
    volumes:
      - ./:/app
      - ./docker/nginx/vhost.conf:/etc/nginx/conf.d/vhost.conf
    depends_on:
      - api
      - frontend
      - backend
      - console
      - storage

  node:
    image: node:24-alpine
    volumes:
      - ./:/app
    working_dir: /app

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - 8025:8025

  db:
    image: mysql:8.4
    volumes:
      - /var/lib/mysql
      - ./docker/mysql/config.cnf:/etc/mysql/conf.d/config.cnf
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yii2-starter-kit
      MYSQL_USER: ysk_dbu
      MYSQL_PASSWORD: ysk_pass

networks:
  default:
    name: yii2-starter-kit_default
