namespace: tests\api
actor: Tester
paths:
    tests: .
    output: _output
    data: _data
    helpers: _support
bootstrap: _bootstrap.php
settings:
    suite_class: \PHPUnit_Framework_TestSuite
    colors: true
    memory_limit: 1024M
    log: true
modules:
    enabled:
        - Yii2:
            configFile: '../config/api/functional.php'
