; Runtime settings for the application containers (frontend, backend, api, console, storage).
; These images come straight from yiisoftware/yii2-php, which ships display_errors=On.
;
; PHP 8.4 deprecates implicit nullable types. Some third-party libraries used by this
; project (league/uri-*, guzzlehttp/promises, psy/psysh) still trigger those notices,
; and printing them into a response breaks headers and output.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
display_errors = Off
display_startup_errors = Off
log_errors = On
