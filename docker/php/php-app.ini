; Runtime overrides for the application containers (frontend, backend, api,
; console, storage). Mounted to /usr/local/etc/php/conf.d/zz-app.ini, so the
; "zz-" prefix makes it load after the image's own conf.d files and win.
;
; The yiisoftware/yii2-php images already ship the following in conf.d/base.ini,
; so they are not repeated here:
;   date.timezone, max_execution_time, sys_temp_dir, upload_tmp_dir,
;   expose_php, cgi.fix_pathinfo, session.upload_progress.enabled (CVE-2026-109619),
;   short_open_tag and a tuned OPcache block.
; Everything below either differs from those defaults or narrows them further.

; --- Errors and logging -------------------------------------------------------
; PHP 8.4 deprecates implicit nullable types, and libraries used by this project
; (league/uri-*, guzzlehttp/promises, psy/psysh) still emit those notices. The
; image turns display_errors on, which would print them into the response body
; and break headers, so route them to the log instead.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
html_errors = Off

; --- Upload and memory limits -------------------------------------------------
; The base image allows 60M uploads inside a 128M memory_limit. This project
; ships a file manager and Redactor image uploads, so both ceilings are raised
; together, preserving the CVE-2026-109618 invariant that a request body must
; stay below memory_limit.
memory_limit = 1G
upload_max_filesize = 512M
post_max_size = 512M
