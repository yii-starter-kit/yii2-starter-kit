namespace: tests\frontend
actor: Tester
bootstrap: _bootstrap.php
paths:
    tests: .
    output: ./_output
    data: ./_data
    helpers: ./_support
settings:
    suite_class: \PHPUnit_Framework_TestSuite
    colors: true
    memory_limit: 1024M
modules:
    enabled:
        - Yii2:
            configFile: '../config/frontend/functional.php'
