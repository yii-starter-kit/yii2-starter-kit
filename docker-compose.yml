# The application containers query MySQL while Yii boots, so wait until the
# server really accepts connections instead of relying on start order.
x-db-dependency: &db-dependency
  depends_on:
    db:
      condition: service_healthy

services:
  frontend:
    build: frontend
    <<: *db-dependency
    volumes:
      # Mount source-code for development
      - ./:/app
      - ./docker/php/php-app.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro

  backend:
    build: backend
    <<: *db-dependency
    volumes:
      # Mount source-code for development
      - ./:/app
      - ./docker/php/php-app.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro

  console:
    build: console
    <<: *db-dependency
    volumes:
      # Re-use local composer cache via host-volume
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      # Mount source-code for development
      - ./:/app
      - ./docker/php/php-app.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    working_dir: /app

  storage:
    build: storage
    <<: *db-dependency
    volumes:
      # Mount source-code for development
      - ./:/app
      - ./docker/php/php-app.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro

  api:
    build: api
    <<: *db-dependency
    volumes:
      # Mount source-code for development
      - ./:/app
      - ./docker/php/php-app.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro

  nginx:
    image: nginx:stable-alpine
    ports:
      - 80:80
    volumes:
      - ./:/app
      - ./docker/nginx/vhost.conf:/etc/nginx/conf.d/vhost.conf
    depends_on:
      api:
        condition: service_started
      backend:
        condition: service_started
      console:
        condition: service_started
      frontend:
        condition: service_started
      storage:
        condition: service_started

  node:
    image: node:24-alpine
    volumes:
      - ./:/app
    working_dir: /app

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - 8025:8025

  db:
    image: mysql:8.4
    volumes:
      - /var/lib/mysql
      - ./docker/mysql/config.cnf:/etc/mysql/conf.d/config.cnf
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yii2-starter-kit
      MYSQL_USER: ysk_dbu
      MYSQL_PASSWORD: ysk_pass
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  default:
    name: yii2-starter-kit_default
